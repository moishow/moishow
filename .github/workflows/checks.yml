name: Spring and handoff checks
on:
  push:
    branches: [main, develop, 'issue/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - run: bash mvnw -B verify
        working-directory: apps/api
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-handoff.mjs
