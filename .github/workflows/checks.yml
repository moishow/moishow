name: Spring, mobile, operator and handoff checks
on:
  push:
    branches: [main, develop, 'issue/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/api/*.gradle
            apps/api/gradle/wrapper/gradle-wrapper.properties
      - run: bash gradlew --no-daemon build
        working-directory: apps/api
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/check-handoff.mjs
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, reviewed action.yaml
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build web
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
