name: Spring, handoff and reference checks
on:
  push:
    branches: [main, develop, 'issue/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/api/*.gradle
            apps/api/gradle/wrapper/gradle-wrapper.properties
      - run: bash gradlew --no-daemon build
        working-directory: apps/api
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/check-handoff.mjs
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
