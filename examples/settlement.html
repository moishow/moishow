<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정산 계산기 — 모이쇼</title><link rel="stylesheet" href="../design/system/tokens.css"><link rel="stylesheet" href="../assets/hub.css"><style>.calculator{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}.panel{background:white;border:1px solid var(--border-default);border-radius:20px;padding:24px}label{display:block;margin:16px 0;font-size:14px}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid var(--border-default);border-radius:10px;font:inherit}button{padding:12px 24px;border:0;border-radius:12px;background:var(--color-primary);color:white;font:inherit;font-weight:700}output{font-size:32px;font-weight:800;color:var(--color-primary);display:block;margin:16px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 0;border-bottom:1px solid var(--border-subtle)}.error{color:var(--color-danger-strong);min-height:24px}.detail{font-size:13px;color:var(--text-muted)}</style></head><body><main class="hub"><a href="../index.html">설계 허브</a><header><p class="eyebrow">ISSUE #11 · EXECUTABLE POLICY</p><h1>정책을 숫자로<br>직접 확인하세요.</h1><p>브라우저와 테스트가 같은 정산 모듈을 사용합니다. 외부 송금·저장은 실행하지 않습니다.</p></header><div class="calculator"><form id="calculator" class="panel"><h2>이벤트 입력</h2><label>각 차수 참석자 수<input name="count" type="number" min="0" max="1000" step="1" value="4" required></label><label>1차 실제 지출<input name="expense1" type="number" min="0" step="1" value="100000" required></label><label>1차 취소 비용 실제 수령액<input name="fee" type="number" min="0" step="1" value="20000" required></label><label>2차 실제 지출<input name="expense2" type="number" min="0" step="1" value="40000" required></label><label>나의 확인 입금액<input name="paid" type="number" min="0" step="1" value="40000" required></label><label>이미 지급받은 환불액<input name="refunded" type="number" min="0" step="1" value="0" required></label><button type="submit">정산 계산</button><p class="error" id="error" role="alert"></p></form><section class="panel" aria-live="polite"><h2>나의 이벤트 순차액</h2><output id="result">계산 준비 중</output><table><tbody id="breakdown"></tbody></table><p class="detail">수령 취소 비용은 실제 확인 입금에 포함합니다. 확인 전 신고는 계산에 포함하지 않습니다. 참석자 0명은 주최자 부담을 표시하며 자기 계좌 송금 요청이 아닙니다.</p><a href="../docs/product/index.html">정책 근거</a></section></div></main><script type="module" src="settlement-demo.mjs"></script></body></html>
