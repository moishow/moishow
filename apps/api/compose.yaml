services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moishow
      POSTGRES_USER: moishow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD before starting local PostgreSQL}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - moishow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moishow -d moishow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  moishow-postgres:
