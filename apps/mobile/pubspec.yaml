name: moishow
description: 모임과 정산 기록을 잇는 모이쇼 앱
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  kakao_flutter_sdk_user: ^1.9.7
  stomp_dart_client: ^2.1.3
  image_picker: ^1.2.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0
  flutter_web_auth_2: ^4.1.0
  crypto: ^3.0.6
  pdfx: ^2.11.0
  url_launcher: ^6.3.3
  cupertino_icons: ^2.0.0
dev_dependencies:
  image_picker_platform_interface: 2.11.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
